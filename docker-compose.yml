version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: oil_sif_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oil_admin
      POSTGRES_PASSWORD: oil_secure_password_sih2024
      POSTGRES_DB: oil_sif_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oil_admin -d oil_sif_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oil_sif_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://oil_admin:oil_secure_password_sih2024@postgres:5432/oil_sif_db
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
      - MODEL_DIR=/app/models
      - DATASET_PATH=/app/data/OIL_SIF_Synthetic_Dataset_5000.csv
    volumes:
      - ./data:/app/data
      - ./backend/models:/app/models
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oil_sif_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
